name: Spatial AI Perception CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-jetson-targets:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # FIX: Uses the verified, industry-standard marketplace action for CUDA installation
    - name: Install CUDA Toolkit Environment
      uses: Jimver/cuda-toolkit@v0.2.36
      with:
        cuda: '12.2'
        method: 'network'
        sub-packages: '["compiler", "toolkit"]'

    - name: Verify Compiler Availability
      run: |
        nvcc --version
        cmake --version

    - name: Configure CMake Build Matrix
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Compile Aerospace Shared Object
      run: |
        cd build
        make -j$(nproc)

    # FIX: Corrected to the valid, official GitHub action repository layout
    - name: Archive Production Shared Library Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libspatial_ai_perception
        path: build/libspatial_ai_perception.so
